<h2>Dolgozók</h2>

<button class="btn btn-primary" (click)="toggleModal()">Hozzáad</button>


<table class="table table-striped">
  <thead>
    <tr>
      <th>Id</th>
      <th>Név</th>
      <th>Település</th>
      <th>Fizetés</th>
      <th>Beosztás</th>
      <th>Műveletek</th>
    </tr>
  </thead>
  <tbody>
    @for( emp of employees() ; track emp.id) {
      <tr>
        <td>{{emp.id}}</td>
        <td>{{emp.name}}</td>
        <td>{{emp.city}}</td>
        <td>{{emp.salary}}</td>
        <td>{{emp.positionId | positionName:positions()}}</td>
        <td>
        <button (click)="onclickEdit(emp)" class="btn btn-outline-pink btn-sm" title="Szerkesztés">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
          <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
          <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
        </svg>
      </button>

      <button (click)="deleteEmployee(emp.id)" class="btn btn-outline-danger btn-sm ms-1" title="Törlés">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3" viewBox="0 0 16 16">
        <path d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"/>
      </svg>
    </button>
        </td>
      </tr>
      
    }
  </tbody>
</table>



@if(visibleModal) {


<div>
    
    <div class="modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              {{addmode ? 'Hozzáadás' : 'Módosítás'}}
            </h5>
            
            <button type="button" class="btn-close" 
            data-bs-dismiss="modal" aria-label="Close"
            (click)="toggleModal()"></button>
          </div>
          <div class="modal-body">
            

            <form [formGroup]="employeeForm" 
            (ngSubmit)="saveEmployee()" id="employeeForm">
              @if(!addmode){
                <div>
                      <label for="id" class="form-label">Id</label>
                      <input type="text" class="form-control"
                      formControlName="id" id="id" readonly>
                  </div>
              }
                <div>
                    <label for="name" class="form-label">Név</label>
                    <input type="text" class="form-control"
                    formControlName="name" id="name">
                </div>
                <div>
                    <label for="city" class="form-label">Település</label>
                    <input type="text" class="form-control"
                    formControlName="city" id="city">
                </div>
                <div>
                    <label for="salary" class="form-label">Fizetés</label>
                    <input type="text" class="form-control"
                    formControlName="salary" id="salary">
                </div>
                <div>
                    <label for="positionId" class="form-label">Beosztás</label>
                    <!-- <input type="text" class="form-control"
                    formControlName="positionId" id="positionId"> -->
                    <select formControlName="positionId" id="positionId" class="form-select">
                      @for(pos of positions(); track pos.id){
                        <option value="{{pos.id}}">{{pos.name}}</option>
                      }
                    </select>
                </div>
            </form>


          </div>
          <div class="modal-footer">
            <button type="button" 
            class="btn btn-secondary" 
            (click)="toggleModal()">Bezárás</button>
            
            <button type="submit" class="btn btn-primary"
            form="employeeForm">Mentés</button>
          </div>
        </div>
      </div>
    </div>
</div>
}
